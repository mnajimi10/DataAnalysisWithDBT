name: CI - dbt Airflow Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Check Airflow DAG syntax
        run: |
          python -m py_compile airflow/dags/*.py  


      - name: Install dbt dependencies
        run: |
          pip install dbt-core==1.9.4 dbt-snowflake==1.9.4

      - name: Run dbt debug


       # run: |
        working-directory: ./netproject
        run: dbt debug --profiles-dir ../.dbt  


      - name: Run dbt dependencies
        working-directory: ./netproject
        run: dbt deps --profiles-dir ../.dbt

      - name: Run dbt tests
        working-directory: ./netproject
        run: dbt test --profiles-dir ../.dbt  